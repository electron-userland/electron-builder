name: 'Node.js setup'
description: 'actions/setup-node with the Node.js version and check-latest shared by every workflow'

inputs:
  cache:
    description: "Package manager whose store actions/setup-node caches ('pnpm'); empty for no cache"
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # check-latest: the latest Node.js 22 release, not the one in the runner's tool cache, which can lag behind
    - name: Setup node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        check-latest: true
        cache: ${{ inputs.cache }}

## Usage
# - name: Setup node
#   uses: $/.github/actions/setup-node
# Workflows that need the dependencies use $/.github/actions/pnpm, which runs this one with cache: pnpm.
