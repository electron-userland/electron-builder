name: 'Setup Tests'
description: 'Set up pnpm, node w/ pnpm cache, install deps, compile, and restore electron cache'
inputs:
  cache-key:
    description: 'The key to the electron cache'
    required: true
  cache-path:
    description: 'The path to the electron cache'
    required: true
  reset-vitest-smart-cache:
    description: "Reset Vitest smart cache (planning shows all tests as 'unknown' and shards split evenly; cache is repopulated from this run for future runs)"
    required: false
    default: "false"
  collect-coverage:
    description: "Collect v8 code coverage during the test run (opt-in; merged into a downloadable report by the merge job)"
    required: false
    default: "false"
  smart-cache-source:
    description: "Exact smart cache snapshot the shard planner used ('<artifact-name>@<run-id>' or 'none'). Shard jobs must pass it so their in-job plan matches the matrix; leave empty to resolve the latest cache for the ref."
    required: false
    default: ""

outputs:
  smart-cache-source:
    description: "The smart cache snapshot that was restored ('<artifact-name>@<run-id>' or 'none'); empty on a reset run"
    value: ${{ steps.fetch-smart-cache.outputs.source }}

runs:
  using: 'composite'
  steps:
    - name: Setup PNPM and install dependencies
      uses: $/.github/actions/pnpm

    - name: Compile
      run: pnpm compile
      shell: bash

    # Electron zips and electron-builder toolsets: every job restores the newest snapshot for its key prefix, and the
    # save-test-caches action (run at the end of every test job by upload-test-artifacts) saves a new one only when the job
    # downloaded something the snapshot lacked, keyed by a fingerprint of the cached files. So a snapshot that misses
    # artifacts only some shards need (e.g. the win32 ia32/arm64 Electron zips) is completed by the first job that fetches
    # them, and a job with nothing new uploads nothing (a run_id key made all ~40 jobs of every run upload ~1 GB each,
    # churning the repository's cache storage). The `-latest` key is never saved; it only makes restore-keys pick the newest.
    - name: Restore Electron cache
      id: electron-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.cache-path }}
        key: ${{ inputs.cache-key }}-latest
        restore-keys: |
          ${{ inputs.cache-key }}-

    - name: Restore electron-builder binaries cache
      id: binaries-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/electron-builder
          ~/Library/Caches/electron-builder
          ~\AppData\Local\electron-builder\Cache
        key: electron-builder-binaries-${{ runner.os }}-${{ hashFiles('packages/app-builder-lib/src/toolsets/*.ts') }}-latest
        restore-keys: |
          electron-builder-binaries-${{ runner.os }}-${{ hashFiles('packages/app-builder-lib/src/toolsets/*.ts') }}-
          electron-builder-binaries-${{ runner.os }}-

    # What save-test-caches compares against and saves under
    - name: Record restored test caches
      run: |
        node "${GITHUB_ACTION_PATH}/../save-test-caches/cache-files.mjs" record "${RUNNER_TEMP}/electron-cache-files.txt" "${ELECTRON_CACHE_PATH}"
        node "${GITHUB_ACTION_PATH}/../save-test-caches/cache-files.mjs" record "${RUNNER_TEMP}/binaries-cache-files.txt" "${BINARIES_CACHE_PATHS}"
        {
          echo "TEST_CACHE_ELECTRON_PATH=${ELECTRON_CACHE_PATH}"
          echo "TEST_CACHE_ELECTRON_KEY=${ELECTRON_CACHE_KEY}"
          echo "TEST_CACHE_BINARIES_KEY=${BINARIES_CACHE_KEY}"
        } >> "$GITHUB_ENV"
      shell: bash
      env:
        ELECTRON_CACHE_PATH: ${{ inputs.cache-path }}
        ELECTRON_CACHE_KEY: ${{ inputs.cache-key }}
        BINARIES_CACHE_KEY: electron-builder-binaries-${{ runner.os }}-${{ hashFiles('packages/app-builder-lib/src/toolsets/*.ts') }}
        # keep in sync with the path list of the restore step above and of save-test-caches
        BINARIES_CACHE_PATHS: |
          ~/.cache/electron-builder
          ~/Library/Caches/electron-builder
          ~\AppData\Local\electron-builder\Cache

    - name: Compute Vitest smart cache ref
      id: compute-cache-ref
      run: |
        if [ -n "${PR_NUM}" ]; then
          echo "value=PR-${PR_NUM}" >> "$GITHUB_OUTPUT"
        else
          # Artifact names cannot contain "/", so sanitize slashes in branch
          # names like "release/v26" -> "release-v26" (keep in sync with detectRef in fetch-smart-cache.ts).
          echo "value=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
      env:
        PR_NUM: ${{ github.event.pull_request.number }}

    # Skip the restore entirely on a reset run: there is no point downloading the previous cache
    # only to ignore it. Combined with the RESET_VITEST_SHARD_CACHE guard in loadCache(), this makes
    # the shard plan show every file as "unknown" and split shards evenly. (Cache file is gitignored,
    # so a fresh checkout has none — nothing is loaded.)
    - name: Restore Vitest Smart Cache
      id: fetch-smart-cache
      if: inputs.reset-vitest-smart-cache != 'true'
      run: pnpm ci:test:fetch-cache
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VITEST_CACHE_REF: ${{ steps.compute-cache-ref.outputs.value }}
        VITEST_SMART_CACHE_SOURCE: ${{ inputs.smart-cache-source }}

    - name: Set up Vitest smart cache reset flag
      run: |
        if [ "${INPUTS_RESET_VITEST_SMART_CACHE}" = "true" ]; then
          echo "RESET_VITEST_SHARD_CACHE=true" >> "$GITHUB_ENV"
        else
          echo "RESET_VITEST_SHARD_CACHE=false" >> "$GITHUB_ENV"
        fi
      shell: bash
      env:
        INPUTS_RESET_VITEST_SMART_CACHE: ${{ inputs.reset-vitest-smart-cache }}

    - name: Set up Vitest coverage flag
      run: |
        if [ "${INPUTS_COLLECT_COVERAGE}" = "true" ]; then
          echo "VITEST_COVERAGE=true" >> "$GITHUB_ENV"
        else
          echo "VITEST_COVERAGE=false" >> "$GITHUB_ENV"
        fi
      shell: bash
      env:
        INPUTS_COLLECT_COVERAGE: ${{ inputs.collect-coverage }}

## Usage
# - name: Setup Tests
#   uses: $/.github/actions/pretest
#   with:
#     cache-path: ~/Library/Caches/electron
#     cache-key: v-42.4.0-macos-electron
