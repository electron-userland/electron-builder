name: 'Netlify Deploy - Release'

on:
  release:
    types: ['published']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    name: 'Deploy Release'
    runs-on: ubuntu-latest
    # Release-triggered runs execute the workflow file from the release tag's commit,
    # so this file only ever runs for master-line (current major) tags. The guard is a
    # belt on top of that: never prod-deploy from a non-current-major release event.
    # (release/v26 carries its own copy of this workflow, gated separately on that branch.)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'electron-builder@27.')

    steps:
      - name: Checkout code repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install deps and audit
        uses: ./.github/actions/pnpm

      - name: Build composed multi-version docusaurus site
        # One self-contained docker build: the container builds the current
        # checkout at "/" and, for each ref in RELEASE_TAGS, that branch/tag's
        # site under its own sub-path (release/v26 → /v26/). See
        # website/scripts/build-versioned-site.sh.
        run: pnpm docs:all
        env:
          # release/v26 is also the script's default; kept explicit for visibility.
          RELEASE_TAGS: release/v26

      - uses: jsmrcaga/action-netlify-deploy@ae36ac1b3d1ad3646eecb5631977e7314d3a6a2f # v2.4.0
        with:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_DEPLOY_MESSAGE: "Prod deploy v${{ github.ref }}"
          NETLIFY_DEPLOY_TO_PROD: true
          install_command: "echo Skipping installing the dependencies"
          build_command: "echo Skipping building the web files"
          build_directory: "website/build"
          monorepo_package: "electron-builder"

      # Creates a status check with link to preview
      - name: Set Status check on commit
        uses: guibranco/github-status-action-v2@77639353504055053524efa7a3719aaf0b731ce9 # v1.2.4
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          state: success
          context: Netlify Documentation Site preview
          description: Production - Click "details"
          target_url: ${{ env.NETLIFY_PREVIEW_URL }}
          sha: ${{github.event.pull_request.head.sha || github.sha}}
