name: 'Netlify Deploy - Release'

on:
  release:
    types: ['published']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    name: 'Deploy Release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install deps and audit
        uses: ./.github/actions/pnpm

      - name: Build docusaurus site
        run: pnpm docs:all

      # The production site (electron.build) is deployed exclusively by the
      # master branch's copy of this workflow, which composes the current-major
      # docs at "/" with this branch's docs at "/v26/". Release events run the
      # workflow file from the released tag's commit, so this v26 copy must
      # never deploy to prod — otherwise a v26 patch release would overwrite
      # the site with v26-only docs. Keep building a draft (preview) deploy so
      # v26 releases still get an inspectable docs preview.
      - uses: jsmrcaga/action-netlify-deploy@ae36ac1b3d1ad3646eecb5631977e7314d3a6a2f # v2.4.0
        with:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_DEPLOY_MESSAGE: "Preview deploy (v26 docs) ${{ github.ref }}"
          NETLIFY_DEPLOY_TO_PROD: false
          install_command: "echo Skipping installing the dependencies"
          build_command: "echo Skipping building the web files"
          build_directory: "website/build"
          monorepo_package: "electron-builder"

      # Creates a status check with link to preview
      - name: Set Status check on commit
        uses: guibranco/github-status-action-v2@0849440ec82c5fa69b2377725b9b7852a3977e76 # v1.1.13
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          state: success
          context: Netlify Documentation Site preview
          description: Preview - Click "details"
          target_url: ${{ env.NETLIFY_PREVIEW_URL }}
          sha: ${{github.event.pull_request.head.sha || github.sha}}
