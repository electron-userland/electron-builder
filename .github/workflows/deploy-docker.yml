name: Docker Deployment

on:
  # release:
  #   types: [published]
  # a new version of the private package docker, from the Release workflow (pr-release.yml) on master, which also pushes
  # its tag docker@<version>. There is no tag trigger: the deploy job is in the `release` environment, whose branch policy
  # a run on a tag does not pass, so pushing a docker@ tag starts nothing
  workflow_call:
  # by hand from the Actions tab, e.g. to fill the registry before the first release deploy. It builds, and pushes and
  # attests only with `push` checked, and only on master: a branch that has not been reviewed and merged must not push
  # to the registry. With `push` checked on another ref, the check-ref job fails the run before anything is built
  workflow_dispatch:
    inputs:
      push:
        description: Push and attest the images (unchecked, the run only builds)
        type: boolean
        default: false

# every job states what it needs; a caller (pr-release.yml) has to grant at least as much to its deploy-docker job
permissions: {}

env:
  LATEST_IMAGE_NODE_MAJOR_VERSION: 24
  IMAGE: ghcr.io/electron-userland/builder

jobs:
  # images are pushed from master only, by both triggers: the Release workflow calls this workflow on master only (its tag
  # step runs on master only), and a manual run pushes only on master. Fails early, before the builds, otherwise
  check-ref:
    name: Push from master only
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Fail a push from another ref than master
        if: ${{ github.ref != 'refs/heads/master' && (github.event_name != 'workflow_dispatch' || inputs.push) }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::The images are pushed from master only, not from $REF. Run the workflow on master, or uncheck push to only build"
          exit 1

  run-docker-build:
    needs: check-ref
    permissions:
      contents: read
    uses: $/.github/workflows/docker-build.yml

  deploy:
    name: Build and Push Docker
    needs: run-docker-build
    runs-on: ubuntu-24.04
    # no secrets: the push authenticates with the job's GITHUB_TOKEN (packages: write) and the attestations are signed
    # with a short-lived Sigstore certificate from the job's OIDC token (id-token: write). It pushes from master only
    # (check-ref, and PUSH below); the environment allows master, release/* and changeset-release/* only, so a manual run
    # that only builds has to be on one of them
    environment: release
    permissions:
      contents: read
      # push to ghcr.io/electron-userland/builder
      packages: write
      # OIDC token for the Sigstore signing certificate of the provenance attestations
      id-token: write
      # store the provenance attestations in the repository's attestations API
      attestations: write
    env:
      # 'true' when this job pushes and attests the images: a run from the Release workflow, or a manual run with push
      # checked, on master only (check-ref already failed the run otherwise; the ref is checked again here)
      PUSH: ${{ (github.event_name != 'workflow_dispatch' || inputs.push) && github.ref == 'refs/heads/master' }}
    strategy:
      # each Node.js version is pushed by its own job: a failed one must not cancel the others in the middle of their
      # pushes. Re-run the failed jobs while the image artifacts are kept (a day, docker-build.yml)
      fail-fast: false
      matrix:
        nodeMajorVersion: [
          14, 16, 18, 20, 22, 24
        ]
    steps:
      - name: Cleanup runner
        uses: $/.github/actions/cleanup-runner

      # the version of the docker package at this commit, the one docker-build.yml tagged the images with (build.sh)
      - name: Checkout docker/package.json
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docker/package.json
          sparse-checkout-cone-mode: false

      - name: Read the docker package version
        id: version
        run: |
          set -euo pipefail
          version=$(jq -r .version docker/package.json)
          echo "docker@$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download images artifact - node${{ matrix.nodeMajorVersion }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: electron-builder-all-${{ matrix.nodeMajorVersion }}
          path: ${{ runner.temp }}

      - name: Load all images
        run: docker image load --input "$RUNNER_TEMP/electron-builder-all-$NODE_MAJOR_VERSION.tar"
        env:
          NODE_MAJOR_VERSION: ${{ matrix.nodeMajorVersion }}

      - name: Tag LTS (${{ env.LATEST_IMAGE_NODE_MAJOR_VERSION }}) images for electron-builder latest/wine/wine-chrome/wine-mono
        if: ${{ matrix.nodeMajorVersion == env.LATEST_IMAGE_NODE_MAJOR_VERSION }}
        run: |
          docker image tag "$IMAGE:$LATEST_IMAGE_NODE_MAJOR_VERSION" "$IMAGE:latest"
          docker image tag "$IMAGE:$LATEST_IMAGE_NODE_MAJOR_VERSION-wine" "$IMAGE:wine"
          docker image tag "$IMAGE:$LATEST_IMAGE_NODE_MAJOR_VERSION-wine-mono" "$IMAGE:wine-mono"
          docker image tag "$IMAGE:$LATEST_IMAGE_NODE_MAJOR_VERSION-wine-chrome" "$IMAGE:wine-chrome"

      - name: List all images and tags
        run: docker image ls -a

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip the push (workflow_dispatch without push)
        if: env.PUSH != 'true'
        run: echo "Not pushing (run the workflow on master with push checked to push and attest the images)"

      # The versioned tags (<image>-<version>) are immutable: the job fails before it pushes anything when one of them
      # is in the registry already, so a version is never overwritten (release a new version instead). The moving tags
      # (<node>, <node>-wine, …, latest, wine, …) move to the new images. Only the LTS job pushes base and base-<version>:
      # every job builds its own base, and only one of them can have the versioned tag. The digests are those of the
      # registry's manifests, read back after the push: the attestations name them. The moving tags are the same
      # manifests as the versioned ones, so they are covered too
      - name: Push all Docker images
        id: push
        if: env.PUSH == 'true'
        run: |
          set -euo pipefail
          # <output key>=<image>: the image is tagged <image> (moving) and <image>-<version> (immutable)
          images="node=$NODE_MAJOR_VERSION wine=$NODE_MAJOR_VERSION-wine wine-mono=$NODE_MAJOR_VERSION-wine-mono \
            wine-chrome=$NODE_MAJOR_VERSION-wine-chrome"
          aliases=""
          if [ "$NODE_MAJOR_VERSION" = "$LATEST_IMAGE_NODE_MAJOR_VERSION" ]; then
            images="base=base $images"
            aliases="latest wine wine-mono wine-chrome"
          fi

          for entry in $images; do
            tag="${entry#*=}-$VERSION"
            if out=$(docker buildx imagetools inspect --raw "$IMAGE:$tag" 2>&1); then
              echo "::error::$IMAGE:$tag is already in the registry, and a versioned tag is never overwritten. Release a new docker version (a changeset for docker) to deploy again"
              exit 1
            fi
            # anything but a missing tag (e.g. a registry or auth error) also stops the job: it cannot tell that the
            # push would not overwrite
            if ! grep -qiE 'not found|manifest unknown|name unknown' <<< "$out"; then
              echo "::error::Could not check whether $IMAGE:$tag is in the registry: $out"
              exit 1
            fi
          done

          # the versioned tags first, then the moving ones
          for entry in $images; do
            docker image push "$IMAGE:${entry#*=}-$VERSION"
          done
          for entry in $images; do
            docker image push "$IMAGE:${entry#*=}"
          done
          for alias in $aliases; do
            docker image push "$IMAGE:$alias"
          done

          for entry in $images; do
            tag="${entry#*=}-$VERSION"
            digest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            echo "$IMAGE:$tag $digest"
            echo "${entry%%=*}=$digest" >> "$GITHUB_OUTPUT"
          done
        env:
          NODE_MAJOR_VERSION: ${{ matrix.nodeMajorVersion }}
          VERSION: ${{ steps.version.outputs.version }}

      # one attestation per image: push-to-registry takes a single subject, the digest of the image's versioned tag
      - name: Attest base
        if: ${{ env.PUSH == 'true' && matrix.nodeMajorVersion == env.LATEST_IMAGE_NODE_MAJOR_VERSION }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.base }}
          push-to-registry: true
          # a storage record needs the artifact-metadata permission; the attestation does not
          create-storage-record: false

      - name: Attest ${{ matrix.nodeMajorVersion }}
        if: env.PUSH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.node }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest ${{ matrix.nodeMajorVersion }}-wine
        if: env.PUSH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.wine }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest ${{ matrix.nodeMajorVersion }}-wine-mono
        if: env.PUSH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.wine-mono }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest ${{ matrix.nodeMajorVersion }}-wine-chrome
        if: env.PUSH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.wine-chrome }}
          push-to-registry: true
          create-storage-record: false
